# [[ General options ]]

# Enable uncommon key combinations (e.g. <C-CR> or <C-S-a>)
set -g extended-keys on

# Start windows and panes indexing at 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Change the prefix key
unbind C-b # Default prefix
set -g prefix C-Space
bind C-Space send-prefix

# Use the terminal background for popups
set -g popup-style 'bg=default,fg=default'
set -ag popup-border-style 'bg=default'

# Increase the maximum length of the left status bar section
set -g status-left-length 50

# Enable OpenCode notifications to reach the OS
set -g allow-passthrough all
set-environment -g OPENTUI_NOTIFICATION_PROTOCOL osc777

# Don't inherit VIRTUAL_ENV variable from parent shell (doesn't come with the actual virtualenv activation and causes issues with the Python virtualenv activation hooks)
setenv -gr VIRTUAL_ENV

# Track window visits across sessions for the custom window switcher sorting
set -gqo @window-visit-sequence 0
set-hook -g session-window-changed[0] {
    set -gF @window-visit-sequence "#{e|+:#{@window-visit-sequence},1}"
    set -wF @window-last-visited "#{@window-visit-sequence}"
}
set-hook -g client-session-changed[0] {
    set -gF @window-visit-sequence "#{e|+:#{@window-visit-sequence},1}"
    set -wF @window-last-visited "#{@window-visit-sequence}"
}
set-hook -g client-attached[0] {
    set -gF @window-visit-sequence "#{e|+:#{@window-visit-sequence},1}"
    set -wF @window-last-visited "#{@window-visit-sequence}"
}

# Set OpenCode integration hooks
set-hook -g after-select-pane[0] 'run-shell "~/.config/tmux/scripts/opencode-panes.sh acknowledge #{pane_id}"'
set-hook -g after-select-window[0] 'run-shell "~/.config/tmux/scripts/opencode-panes.sh acknowledge #{pane_id}"'
set-hook -g session-window-changed[1] 'run-shell "~/.config/tmux/scripts/opencode-panes.sh acknowledge #{pane_id}"'
set-hook -g client-session-changed[1] 'run-shell "~/.config/tmux/scripts/opencode-panes.sh acknowledge #{pane_id}"'

# [[ Key Bindings ]]
# Default key bindings can be seen with <prefix>?

# Enable Vim-like key bindings
set -g mode-keys vi

# Override window and session switching key bindings with improved versions using fzf
bind Tab display-popup -E "\
    tmux list-windows -a -F '#{?#{@window-last-visited},#{@window-last-visited},0} #{window_activity} #{session_id}:#{window_id} #{session_name}:#{window_index} - #{P/i:#{pane_index}:#{pane_current_command}#{?loop_last_flag,, | }}' |\
    sort -k1,1nr -k2,2nr |\
    fzf --layout=reverse --prompt ' Windows > ' --with-nth=4.. --bind 'load:pos(2)' --bind 'enter:execute-silent(tmux switch-client -t {3})+abort'"
bind BTab display-popup -E "\
    tmux list-sessions -F '#{session_last_attached} #{session_id} #{session_name} (#{session_windows} windows)' |\
    sort -rn |\
    fzf --layout=reverse --prompt ' Sessions > ' --with-nth=3.. --bind 'load:pos(2)' --bind 'enter:execute-silent(tmux switch-client -t {2})+abort'"

# Make sure split key bindings open the new pane in the current directory
bind '"' split-window -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"

# Define new key bindings
bind a new-window -a # Create window after current one
bind b new-window -b # Create window before current one
bind B break-pane
bind e swap-window -t '{last}' \; last-window # Exchange current and last windows
bind J join-pane -h -s ! # Join current and last windows
bind r source ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind O display-popup -E -w 80% -h 70% '~/.config/tmux/scripts/opencode-panes.sh list' # Custom OpenCode integration keymap

# Define repeatable window navigation key bindings
bind -r C-n next-window
bind -r C-p previous-window

# Use Ctrl+number (without prefix) to select windows
bind -n C-1 select-window -t 1
bind -n C-2 select-window -t 2
bind -n C-3 select-window -t 3
bind -n C-4 select-window -t 4
bind -n C-5 select-window -t 5
bind -n C-6 select-window -t 6
bind -n C-7 select-window -t 7
bind -n C-8 select-window -t 8
bind -n C-9 select-window -t 9
bind -n C-0 select-window -t 10

# Define Vim-like key bindings for pane resizing
bind -r C-h resize-pane -L 3
bind -r C-j resize-pane -D 3
bind -r C-k resize-pane -U 3
bind -r C-l resize-pane -R 3

# Enable Vim-like key bindings in copy mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# [[ Plugins ]]

# Change plugins install location
setenv -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins'

# Set up TPM, the Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'

# Define the TPM plugins
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_prefix_mapping_clear_screen "" # Enable <C-l> in key bindings
set -g @plugin 'schasse/tmux-jump'

# Set up the theme with default values and the current theme file, if it exists
# Note that sourcing a theme file with a plugin doesn't work in an if-shell or inside a shell script (known issue with TPM)
set -g status-right "#h"
set -g status-style bg=default
source -q ~/.config/tmux/theme/tmux-current.conf
source -q ~/.config/tmux/integrations/opencode.conf # Custom OpenCode integration status bar item

# Run the TPM plugins setup (this should be kept at the bottom of the file)
run '~/.tmux/plugins/tpm/tpm'
